[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/distwnty/coba/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=distwnty
numprocs=2
redirect_stderr=true
stdout_logfile=/home/distwnty/coba/storage/logs/worker.log
stopwaitsecs=3600
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10 